# Dev stack — hot reload (Vite HMR + Node --watch + Compose file watch)
# Usage: docker compose -f docker-compose.dev.yml up --build --watch
# Or double-click run-docker-dev.bat

services:
  backend:
    build: ./backend
    command: npm run dev
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      UPLOADS_DIR: /app/uploads
      PROJECTS_DATA_PATH: /app/data/projects.json
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ./backend/src:/app/src
      - uploads_data:/app/uploads
      - project_data:/app/data
    develop:
      watch:
        - action: sync+restart
          path: ./backend/package.json
          target: /app/package.json
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
      VITE_BACKEND_URL: http://localhost:4000
      VITE_USE_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ./frontend/package.json
          target: /app/package.json
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
  project_data:
  frontend_node_modules:
